services:
  - type: web
    name: hms-backend
    runtime: docker
    plan: free
    rootDir: SpringbootCRT/demo
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/hms/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hms-postgres
          property: connectionString
      - key: ALLOWED_ORIGIN_PATTERNS
        value: https://*.vercel.app,http://localhost:5173,http://localhost:5180

databases:
  - name: hms-postgres
    databaseName: hms_db
    user: hms_user
    plan: free
