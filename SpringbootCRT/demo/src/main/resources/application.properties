spring.application.name=demo
server.port=${PORT:8080}

# Database Configuration
# Local default uses the existing Docker MySQL container on port 3307.
# Set DATABASE_URL/HMS_DB_URL to use PostgreSQL or another database in deployment.
spring.datasource.url=${DATABASE_URL:${HMS_DB_URL:jdbc:mysql://localhost:3307/hms_db}}
spring.datasource.username=${DB_USER:${HMS_DB_USER:}}
spring.datasource.password=${DB_PASSWORD:${HMS_DB_PASSWORD:}}

# Comma-separated CORS origin patterns for deployed frontends.
app.cors.allowed-origin-patterns=${ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://localhost:3000,https://*.vercel.app}

# Disable automatic schema initialization (HMS handles it)
spring.sql.init.mode=never
